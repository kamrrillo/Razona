[project]
name = "razona-agent"
version = "0.1.0"
description = "Razona · sistema multiagente (Google ADK) para exámenes diagnósticos y preparación ENARM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[db]>=2.15.0,<3",
    "asyncpg>=0.30",
    "supabase>=2.34,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "tzdata>=2024.1",
]

[project.scripts]
razona-cli = "razona_agent.cli:main"
razona-server = "razona_agent.server:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["razona_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: pruebas contra el Supabase local (se omiten si no está disponible)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
